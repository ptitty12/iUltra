<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Messages</title>
  <link rel="icon" type="image/png" href="/static/favicon.png">
  <link rel="apple-touch-icon" href="/static/favicon.png">
  <link rel="manifest" href="/static/manifest.json">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Messages">
  <style>
    body { margin: 0; background: #000; display: flex; justify-content: center; min-height: 100vh; min-height: 100dvh; }
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, 'SF Pro Text', sans-serif; -webkit-tap-highlight-color: transparent; }
    *::-webkit-scrollbar { display: none; }
    * { scrollbar-width: none; -ms-overflow-style: none; }
    .app { width: 100%; max-width: 420px; background: #000; min-height: 100vh; min-height: 100dvh; position: relative; }
    .list-view { display: flex; flex-direction: column; height: 100vh; height: 100dvh; }
    @media (min-width: 500px) {
      body { padding: 2rem 0; background: #1c1c1e; }
      .app { min-height: 620px; border-radius: 40px; overflow: hidden; }
      .list-view { height: 620px; }
      .chat-view { height: 620px !important; }
    }
    .list-topbar { display: flex; justify-content: space-between; align-items: center; padding: 16px 16px 0; }
    .topbar-edit { font-size: 17px; color: #0a84ff; cursor: pointer; }
    .topbar-title { font-size: 17px; font-weight: 600; color: #fff; letter-spacing: -0.3px; }
    .list-bigtitle { font-size: 34px; font-weight: 700; color: #fff; padding: 4px 16px 8px; letter-spacing: -0.5px; }
    .sessions-scroll { flex: 1; overflow-y: auto; }
    .session-row { display: flex; align-items: center; gap: 12px; padding: 10px 16px; border-bottom: 0.5px solid #2c2c2e; cursor: pointer; }
    .session-row:active { background: #1c1c1e; }
    .avatar { width: 50px; height: 50px; border-radius: 50%; background: #1d9e75; display: flex; align-items: center; justify-content: center; font-size: 18px; font-weight: 600; color: white; flex-shrink: 0; }
    .session-info { flex: 1; min-width: 0; }
    .session-name { font-size: 16px; font-weight: 500; color: #fff; }
    .session-preview { font-size: 13px; color: #8e8e93; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; margin-top: 1px; }
    .session-time { font-size: 12px; color: #8e8e93; flex-shrink: 0; }
    .list-bottom { padding: 10px 16px 20px; border-top: 0.5px solid #2c2c2e; background: #000; }
    .search-bar { display: flex; align-items: center; gap: 8px; background: #1c1c1e; border-radius: 12px; padding: 8px 12px; }
    .search-bar span { font-size: 16px; color: #636366; flex: 1; }
    .search-right-icons { display: flex; gap: 14px; align-items: center; }
    .chat-view { display: none; flex-direction: column; height: 100vh; height: 100dvh; background: #000; }
    .chat-header { display: flex; align-items: center; padding: 10px 12px 8px; border-bottom: 0.5px solid #2c2c2e; }
    .back-btn { color: #0a84ff; cursor: pointer; padding: 4px 8px 4px 0; display: flex; align-items: center; gap: 2px; }
    .back-label { font-size: 16px; color: #0a84ff; }
    .header-center { flex: 1; display: flex; flex-direction: column; align-items: center; cursor: pointer; }
    .header-avatar { width: 42px; height: 42px; border-radius: 50%; background: #1d9e75; display: flex; flex-direction: column; align-items: center; justify-content: center; color: white; line-height: 1; }
    .avatar-count { font-size: 16px; font-weight: 600; letter-spacing: -0.3px; }
    .avatar-bac { font-size: 9px; font-weight: 500; letter-spacing: -0.2px; opacity: 0.85; margin-top: 2px; font-variant-numeric: tabular-nums; }
    .header-name { font-size: 12px; color: #fff; margin-top: 2px; font-weight: 500; }
    .messages { flex: 1; overflow-y: auto; padding: 8px 12px; display: flex; flex-direction: column; gap: 3px; background: #000; }
    .msg-pair { display: flex; flex-direction: column; }
    .msg-sent { align-self: flex-end; background: #0a84ff; color: white; padding: 8px 12px; border-radius: 18px 18px 4px 18px; max-width: 72%; font-size: 15px; line-height: 1.4; cursor: pointer; user-select: none; -webkit-user-select: none; }
    .msg-sent.selected { outline: 2px solid #e24b4a; }
    .msg-recv { align-self: flex-start; background: #1c1c1e; color: #fff; padding: 10px 13px; border-radius: 18px 18px 18px 4px; max-width: 76%; font-size: 15px; line-height: 1.5; }
    .msg-time-center { font-size: 11px; color: #8e8e93; text-align: center; margin: 6px 0 2px; }
    .msg-ts { font-size: 11px; color: #8e8e93; align-self: flex-end; margin-top: 1px; margin-bottom: 4px; }
    .input-area { display: flex; align-items: center; gap: 8px; padding: 8px 12px 8px; border-top: 0.5px solid #2c2c2e; background: #000; }
    .input-wrap { flex: 1; display: flex; align-items: center; border: 1px solid #3a3a3c; border-radius: 20px; padding: 6px 12px; min-height: 32px; cursor: text; }
    /* the message field is not a real form field and never takes focus. focusing any
       editable element opens the system keyboard, which always drags its autofill
       accessory bar along with it (no web api can suppress that bar in mobile safari)
       and resizes the visual viewport out from under the layout. so we draw the field,
       the caret and the keyboard ourselves. */
    .fake-input { flex: 1; color: #fff; font-size: 15px; line-height: 20px; min-height: 20px; overflow-wrap: anywhere; }
    .fake-input .ph { color: #636366; }
    .fake-input .sel { background: rgba(10,132,255,0.5); border-radius: 2px; }
    .fake-caret { display: inline-block; width: 2px; height: 17px; background: #0a84ff; vertical-align: -3px; margin-right: 1px; animation: caretBlink 1.1s steps(1) infinite; }
    .fake-input:not(.typing) .fake-caret { display: none; }
    @keyframes caretBlink { 0%, 50% { opacity: 1; } 51%, 100% { opacity: 0; } }

    .modal-input { background: #2c2c2e; border: 0.5px solid #3a3a3c; border-radius: 10px; padding: 10px 12px; margin-bottom: 12px; }
    .keyboard { display: none; flex-shrink: 0; background: #161618; padding-top: 2px; user-select: none; -webkit-user-select: none; }
    .keyboard.active { display: block; }
    /* the rename modal types on the same drawn keyboard, so it has to clear the overlay */
    .keyboard.above { position: relative; z-index: 11; }
    .kb-suggest { display: flex; align-items: center; height: 44px; padding: 0 2px; }
    .kb-sug { flex: 1; min-width: 0; text-align: center; color: #fff; font-size: 16px; line-height: 30px; border-radius: 5px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; padding: 0 4px; cursor: pointer; }
    .kb-sug:active { background: #3a3a3c; }
    .kb-sug.empty:active { background: none; }
    .kb-sep { width: 0.5px; height: 22px; background: #48484a; flex-shrink: 0; }
    .kb-rows { padding: 0 3px; }
    .kb-row { display: flex; justify-content: center; gap: 6px; margin-bottom: 11px; }
    .kb-row.indent { padding: 0 19px; }
    .key { position: relative; flex: 1; min-width: 0; height: 43px; padding: 0; border: none; border-radius: 6px; background: #3c3c3e; color: #fff; font-size: 23px; font-weight: 400; font-family: -apple-system, 'SF Pro Text', sans-serif; box-shadow: 0 1px 0 rgba(0,0,0,0.55); cursor: pointer; -webkit-appearance: none; }
    .key:active { background: #5c5c5e; }
    .key-mod { background: #29292b; font-size: 16px; }
    .key-mod:active { background: #3c3c3e; }
    .key-wide { flex: 1.55; }
    .key-space { flex: 5.2; font-size: 15px; }
    .key-return { flex: 2.1; font-size: 15px; }
    .key-shift-on { background: #fff; color: #000; }
    .key-shift-on:active { background: #fff; }
    .key svg { display: block; margin: 0 auto; }
    /* the magnified bubble ios pops above a letter while your finger is on it */
    .key-pop { display: none; position: absolute; left: -11px; right: -11px; bottom: 100%; margin-bottom: 7px; height: 50px; line-height: 50px; background: #5c5c5e; border-radius: 8px; font-size: 30px; pointer-events: none; box-shadow: 0 2px 6px rgba(0,0,0,0.5); }
    .key.pressed .key-pop { display: block; }
    .kb-bottom { display: flex; align-items: center; justify-content: space-between; height: 42px; padding: 0 16px calc(6px + env(safe-area-inset-bottom, 0px)); }
    .send-btn { width: 30px; height: 30px; border-radius: 50%; background: #0a84ff; border: none; cursor: pointer; display: flex; align-items: center; justify-content: center; flex-shrink: 0; }
    .send-btn svg { fill: white; }

    .typing-indicator { display: flex; gap: 4px; align-items: center; padding: 12px 16px; }
    .typing-indicator .dot { width: 8px; height: 8px; background: #8e8e93; border-radius: 50%; animation: typingBounce 1.4s infinite ease-in-out; }
    .typing-indicator .dot:nth-child(2) { animation-delay: 0.2s; }
    .typing-indicator .dot:nth-child(3) { animation-delay: 0.4s; }
    @keyframes typingBounce { 0%, 60%, 100% { transform: translateY(0); opacity: 0.4; } 30% { transform: translateY(-4px); opacity: 1; } }
    .empty-state { text-align: center; color: #636366; padding: 2rem; font-size: 14px; }
    .overlay { display: none; position: absolute; top: 0; left: 0; right: 0; bottom: 0; background: rgba(0,0,0,0.75); z-index: 10; align-items: center; justify-content: center; border-radius: 40px; }
    .modal-box { background: #1c1c1e; border-radius: 14px; padding: 20px; width: 280px; }
    .modal-box p { color: #fff; font-size: 16px; font-weight: 500; margin-bottom: 12px; text-align: center; }
    .modal-box input { width: 100%; background: #2c2c2e; border: 0.5px solid #3a3a3c; border-radius: 10px; padding: 10px 12px; color: #fff; font-size: 15px; outline: none; margin-bottom: 12px; }
    .modal-box input:focus { border-color: #0a84ff; }
    .modal-actions { display: flex; gap: 8px; }
    .modal-actions button { flex: 1; padding: 10px; border-radius: 10px; border: none; font-size: 15px; cursor: pointer; }
    .btn-cancel { background: #2c2c2e; color: #fff; }
    .btn-save { background: #0a84ff; color: #fff; font-weight: 500; }
    .btn-delete { background: #e24b4a; color: #fff; font-weight: 500; }
    input[type="datetime-local"] { color-scheme: dark; }
    .time-btn { width: 30px; height: 30px; border-radius: 50%; background: #2c2c2e; border: none; cursor: pointer; display: flex; align-items: center; justify-content: center; flex-shrink: 0; color: #0a84ff; }
  </style>
</head>
<body>
<div class="app" id="app">
  <div class="list-view" id="list-view">
    <div class="list-topbar">
      <span class="topbar-edit">Edit</span>
      <span class="topbar-title">Messages</span>
      <span style="cursor:pointer;" id="new-btn">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z" stroke="#0a84ff" stroke-width="1.8" fill="none"/><path d="M16 3l5 5-7 7h-4v-4l6-8z" fill="#0a84ff"/></svg>
      </span>
    </div>
    <div class="list-bigtitle">Messages</div>
    <div class="sessions-scroll"><div id="sessions-list"></div></div>
    <div class="list-bottom">
      <div class="search-bar">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none"><circle cx="11" cy="11" r="7" stroke="#636366" stroke-width="2"/><path d="M16.5 16.5L21 21" stroke="#636366" stroke-width="2" stroke-linecap="round"/></svg>
        <span>Search</span>
        <div class="search-right-icons">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none"><path d="M12 2a3 3 0 0 1 3 3v6a3 3 0 0 1-6 0V5a3 3 0 0 1 3-3z" stroke="#636366" stroke-width="1.8"/><path d="M19 10a7 7 0 0 1-14 0" stroke="#636366" stroke-width="1.8" stroke-linecap="round"/><line x1="12" y1="17" x2="12" y2="21" stroke="#636366" stroke-width="1.8" stroke-linecap="round"/></svg>
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none"><path d="M17 3l4 4-9.5 9.5H8v-3.5L17 3z" stroke="#636366" stroke-width="1.8" stroke-linejoin="round"/><path d="M3 21h18" stroke="#636366" stroke-width="1.8" stroke-linecap="round"/></svg>
        </div>
      </div>
    </div>
  </div>

  <div class="chat-view" id="chat-view">
    <div class="chat-header">
      <div class="back-btn" id="back-btn">
        <svg width="10" height="17" viewBox="0 0 10 17" fill="none"><path d="M9 1L1 8.5L9 16" stroke="#0a84ff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
        <span class="back-label">Messages</span>
      </div>
      <div class="header-center" id="header-center">
        <div class="header-avatar" id="header-avatar">
          <span class="avatar-count" id="header-count">0</span>
          <span class="avatar-bac" id="header-bac">0.000</span>
        </div>
        <div class="header-name" id="header-name">Session</div>
      </div>
      <div style="width:60px;"></div>
    </div>
    <div class="messages" id="messages"></div>
    <div class="input-area">
      <button class="time-btn" id="time-btn" title="log for past time">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none"><circle cx="12" cy="12" r="9" stroke="#0a84ff" stroke-width="1.8"/><path d="M12 7v5l3 2" stroke="#0a84ff" stroke-width="1.8" stroke-linecap="round"/></svg>
      </button>
      <div class="input-wrap" id="input-wrap"><div class="fake-input" id="fake-input"></div></div>
      <button class="send-btn" id="send-btn">
        <svg viewBox="0 0 24 24" width="18" height="18" fill="none"><path d="M12 19V6M12 5.5l-6 6M12 5.5l6 6" stroke="#fff" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/></svg>
      </button>
    </div>
    <div class="keyboard" id="keyboard">
      <div class="kb-suggest" id="kb-suggest"></div>
      <div class="kb-rows" id="kb-rows"></div>
      <div class="kb-bottom">
        <svg width="26" height="26" viewBox="0 0 24 24" fill="none"><circle cx="12" cy="12" r="9.2" stroke="#fff" stroke-width="1.6"/><circle cx="8.8" cy="10" r="1.15" fill="#fff"/><circle cx="15.2" cy="10" r="1.15" fill="#fff"/><path d="M8.2 14.4a4.6 4.6 0 0 0 7.6 0" stroke="#fff" stroke-width="1.6" stroke-linecap="round"/></svg>
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none"><rect x="9" y="2.5" width="6" height="11.5" rx="3" fill="#fff"/><path d="M5.5 11.5a6.5 6.5 0 0 0 13 0" stroke="#fff" stroke-width="1.7" stroke-linecap="round"/><path d="M12 18v3" stroke="#fff" stroke-width="1.7" stroke-linecap="round"/></svg>
      </div>
    </div>
  </div>

  <div class="overlay" id="rename-overlay">
    <div class="modal-box">
      <p>rename session</p>
      <div class="fake-input modal-input" id="rename-field"></div>
      <div class="modal-actions">
        <button class="btn-cancel" id="rename-cancel">cancel</button>
        <button class="btn-save" id="rename-save">save</button>
      </div>
    </div>
  </div>

  <div class="overlay" id="delete-overlay">
    <div class="modal-box">
      <p>what do you want to do?</p>
      <div class="modal-actions" style="flex-direction:column;gap:8px;">
        <button class="btn-save" id="edit-time-btn" style="width:100%;">edit time</button>
        <button class="btn-delete" id="delete-confirm" style="width:100%;">delete</button>
        <button class="btn-cancel" id="delete-cancel" style="width:100%;">cancel</button>
      </div>
    </div>
  </div>

  <div class="overlay" id="edit-time-overlay">
    <div class="modal-box">
      <p id="edit-time-title">edit drink time</p>
      <input type="datetime-local" id="edit-time-input" />
      <div class="modal-actions">
        <button class="btn-cancel" id="edit-time-cancel">cancel</button>
        <button class="btn-save" id="edit-time-save">save</button>
      </div>
    </div>
  </div>

  <div class="overlay" id="backdate-overlay">
    <div class="modal-box">
      <p>log drink for a past time?</p>
      <input type="datetime-local" id="backdate-input" />
      <div class="modal-actions">
        <button class="btn-cancel" id="backdate-now">just now</button>
        <button class="btn-save" id="backdate-save">use this time</button>
      </div>
    </div>
  </div>
</div>

<script>
function drinkColor(total){return total<7?'#1d9e75':total<=12?'#ba7517':'#e24b4a';}
function fmtTime(ts){return new Date(ts).toLocaleTimeString([],{hour:'2-digit',minute:'2-digit'});}
function fmtSessionTime(ts){
  const d=new Date(ts),now=new Date();
  return d.toDateString()===now.toDateString()?fmtTime(ts):d.toLocaleDateString([],{month:'short',day:'numeric'});
}

const API='/api';
let sessions=[];
let cur=null;
let pendingDeleteId=null;
let pendingEditId=null;
let pendingBackdateTs=null;

function tsToLocalInput(ts){
  // convert ms timestamp to 'YYYY-MM-DDTHH:MM' local for datetime-local input
  const d=new Date(ts);
  const pad=n=>String(n).padStart(2,'0');
  return `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}T${pad(d.getHours())}:${pad(d.getMinutes())}`;
}
function localInputToTs(v){
  return new Date(v).getTime();
}

const pendingReplies = new Set();

// --- keyboard ---------------------------------------------------------------
// drawn in-page rather than using the system keyboard: see the note by .fake-input

const KB_LAYOUTS = {
  abc: { rows: [
    ['q','w','e','r','t','y','u','i','o','p'],
    ['a','s','d','f','g','h','j','k','l'],
    ['SHIFT','z','x','c','v','b','n','m','BACK'],
    ['123','SPACE','RETURN']
  ], indent: [false, true, false, false] },
  num: { rows: [
    ['1','2','3','4','5','6','7','8','9','0'],
    ['-','/',':',';','(',')','$','&','@','"'],
    ['#+=','.',',','?','!',"'",'BACK'],
    ['ABC','SPACE','RETURN']
  ], indent: [false, false, true, false] },
  sym: { rows: [
    ['[',']','{','}','#','%','^','*','+','='],
    ['_','\\','|','~','<','>','$','£','¥','•'],
    ['123','.',',','?','!',"'",'BACK'],
    ['ABC','SPACE','RETURN']
  ], indent: [false, false, true, false] }
};
const KEY_SHIFT='<svg width="20" height="20" viewBox="0 0 24 24" fill="none"><path d="M12 3.5L20 12h-4.5v7.5h-7V12H4l8-8.5z" fill="currentColor"/></svg>';
const KEY_CAPS='<svg width="20" height="20" viewBox="0 0 24 24" fill="none"><path d="M12 2.5L20 11h-4.5v5.5h-7V11H4l8-8.5z" fill="currentColor"/><rect x="8.5" y="18.5" width="7" height="2.6" rx="0.6" fill="currentColor"/></svg>';
const KEY_BACK='<svg width="24" height="19" viewBox="0 0 26 20" fill="none"><path d="M8.4 1.2h14.4A2.2 2.2 0 0 1 25 3.4v13.2a2.2 2.2 0 0 1-2.2 2.2H8.4a2.2 2.2 0 0 1-1.6-.7L1 10l5.8-8.1a2.2 2.2 0 0 1 1.6-.7z" fill="#fff"/><path d="M12.4 6.6l7 6.8M19.4 6.6l-7 6.8" stroke="#1c1c1e" stroke-width="1.9" stroke-linecap="round"/></svg>';

let kbMode='abc', shiftOn=false, shiftLocked=false;
let inputText='', renameText='', kbTarget='draft', renameFresh=false;
let VOCAB=[], backTimer=null, backRepeat=null;
const kbEl=document.getElementById('keyboard');
const fakeInput=document.getElementById('fake-input');
const renameField=document.getElementById('rename-field');

function buf(){ return kbTarget==='rename'?renameText:inputText; }
function setBuf(v){ if(kbTarget==='rename') renameText=v; else inputText=v; }
function getDraft(){ return inputText.replace(/\s+/g,' ').trim(); }
function clearDraft(){ inputText=''; renderInput(); }
function kbVisible(){ return kbEl.classList.contains('active'); }

function paintField(el, text, placeholder, active, selected){
  el.innerHTML='';
  el.classList.toggle('typing', active && kbVisible() && !selected);
  const caret=document.createElement('span');caret.className='fake-caret';
  if(text===''){
    el.appendChild(caret);
    const ph=document.createElement('span');ph.className='ph';ph.textContent=placeholder;
    el.appendChild(ph);
  } else if(selected){
    const sel=document.createElement('span');sel.className='sel';sel.textContent=text;
    el.appendChild(sel);
  } else {
    el.appendChild(document.createTextNode(text));
    el.appendChild(caret);
  }
}

function renderInput(){
  paintField(fakeInput, inputText, 'iMessage', kbTarget==='draft', false);
  paintField(renameField, renameText, 'session name', kbTarget==='rename', renameFresh);
  renderSuggest();
}

// the rename field opens with its text selected, like ios — the first key replaces it
function consumeSelection(){
  if(kbTarget==='rename'&&renameFresh){ renameText=''; renameFresh=false; return true; }
  return false;
}

// suggestion strip, backed by the same word list app.py parses drinks with, so
// anything offered here is guaranteed to price out to a real abv
fetch(`${API}/vocab`).then(r=>r.json()).then(v=>{VOCAB=v;renderSuggest();}).catch(()=>{});

function currentWord(){ const m=buf().match(/([A-Za-z0-9']+)$/); return m?m[1]:''; }

function suggestions(){
  const word=currentWord();
  if(!word){
    const s=getSession();
    const recent=[...new Set((s?s.drinks:[]).map(d=>d.raw.trim().toLowerCase()).filter(Boolean))].reverse();
    const out=recent.slice(0,3);
    for(const fallback of ['beer','ipa','shot']){ if(out.length<3 && !out.includes(fallback)) out.push(fallback); }
    return out;
  }
  const w=word.toLowerCase();
  const hits=VOCAB.filter(v=>v.startsWith(w)&&v!==w).sort((a,b)=>a.length-b.length||a.localeCompare(b));
  return ['"'+word+'"', ...hits.slice(0,2)];
}

function renderSuggest(){
  const bar=document.getElementById('kb-suggest');
  bar.innerHTML='';
  const sug=suggestions();
  for(let i=0;i<3;i++){
    if(i){const sep=document.createElement('div');sep.className='kb-sep';bar.appendChild(sep);}
    const el=document.createElement('div');
    el.className='kb-sug'+(sug[i]?'':' empty');
    el.textContent=sug[i]||'';
    if(sug[i]) el.addEventListener('pointerdown',e=>{e.preventDefault();applySuggestion(sug[i]);});
    bar.appendChild(el);
  }
}

function applySuggestion(text){
  consumeSelection();
  if(text.startsWith('"')) setBuf(buf()+' ');        // ios' "keep what i typed" slot
  else setBuf(buf().slice(0, buf().length-currentWord().length)+text+' ');
  renderInput();
}

function renderKeyboard(){
  const rows=document.getElementById('kb-rows');
  rows.innerHTML='';
  const layout=KB_LAYOUTS[kbMode];
  layout.rows.forEach((row,ri)=>{
    const rowEl=document.createElement('div');
    rowEl.className='kb-row'+(layout.indent[ri]?' indent':'');
    row.forEach(key=>{
      const btn=document.createElement('button');
      btn.className='key';
      btn.type='button';
      if(key==='SHIFT'){
        btn.innerHTML=shiftLocked?KEY_CAPS:KEY_SHIFT;
        btn.classList.add('key-mod','key-wide');
        if(shiftOn||shiftLocked) btn.classList.add('key-shift-on');
      } else if(key==='BACK'){
        btn.innerHTML=KEY_BACK;
        btn.classList.add('key-mod','key-wide');
      } else if(key==='123'||key==='ABC'||key==='#+='){
        btn.textContent=key;
        btn.classList.add('key-mod','key-wide');
      } else if(key==='SPACE'){
        btn.textContent='space';
        btn.classList.add('key-space');
      } else if(key==='RETURN'){
        // grey like messages — the blue send arrow lives in the field, not here
        btn.textContent='return';
        btn.classList.add('key-mod','key-return');
      } else {
        const ch=(kbMode==='abc'&&(shiftOn||shiftLocked))?key.toUpperCase():key;
        btn.textContent=ch;
        const pop=document.createElement('span');pop.className='key-pop';pop.textContent=ch;
        btn.appendChild(pop);
      }
      btn.addEventListener('pointerdown',e=>{
        e.preventDefault();
        btn.classList.add('pressed');
        handleKey(key);
        if(key==='BACK'){   // hold to keep deleting, like ios
          backTimer=setTimeout(()=>{backRepeat=setInterval(()=>handleKey('BACK'),70);},450);
        }
      });
      ['pointerup','pointercancel','pointerleave'].forEach(ev=>
        btn.addEventListener(ev,()=>{
          btn.classList.remove('pressed');
          clearTimeout(backTimer);clearInterval(backRepeat);backTimer=backRepeat=null;
        }));
      rowEl.appendChild(btn);
    });
    rows.appendChild(rowEl);
  });
}

function handleKey(key){
  if(key==='SHIFT'){
    if(shiftLocked){ shiftLocked=false; shiftOn=false; }
    else if(shiftOn){ shiftLocked=true; }
    else { shiftOn=true; }
    renderKeyboard();return;
  }
  if(key==='BACK'){
    if(!consumeSelection()) setBuf(buf().slice(0,-1));
    renderInput();return;
  }
  if(key==='123'){ kbMode='num'; renderKeyboard(); return; }
  if(key==='ABC'){ kbMode='abc'; renderKeyboard(); return; }
  if(key==='#+='){ kbMode='sym'; renderKeyboard(); return; }
  if(key==='RETURN'){
    if(kbTarget==='rename') document.getElementById('rename-save').click();
    else sendDrink();
    return;
  }
  let ch = key==='SPACE' ? ' ' : key;
  if(kbMode==='abc'&&(shiftOn||shiftLocked)) ch=ch.toUpperCase();
  consumeSelection();
  setBuf(buf()+ch);
  if(shiftOn&&!shiftLocked){ shiftOn=false; renderKeyboard(); }
  renderInput();
}

function showKeyboard(){
  if(kbVisible())return;
  kbEl.classList.add('active');
  renderKeyboard();renderInput();
  const m=document.getElementById('messages');m.scrollTop=m.scrollHeight;
}
function hideKeyboard(){
  kbEl.classList.remove('active');
  renderInput();
}

document.getElementById('input-wrap').addEventListener('pointerdown',e=>{e.preventDefault();showKeyboard();});
document.getElementById('messages').addEventListener('click',()=>{ if(kbVisible()) hideKeyboard(); });

// a real keyboard (desktop, or a paired one) should still type into whichever
// field the drawn keyboard is pointed at
document.addEventListener('keydown',e=>{
  if(cur===null)return;
  if(overlayOpen&&kbTarget!=='rename')return;
  const t=e.target;
  if(t&&(t.tagName==='INPUT'||t.tagName==='TEXTAREA'||t.isContentEditable))return;
  if(e.metaKey||e.ctrlKey||e.altKey)return;
  if(e.key==='Enter'){e.preventDefault();handleKey('RETURN');}
  else if(e.key==='Escape'&&kbTarget==='rename'){e.preventDefault();document.getElementById('rename-cancel').click();}
  else if(e.key==='Backspace'){e.preventDefault();showKeyboard();handleKey('BACK');}
  else if(e.key.length===1){e.preventDefault();showKeyboard();consumeSelection();setBuf(buf()+e.key);renderInput();}
});

// the modals are the only place a real form field is left. they stay disabled while
// their overlay is hidden so nothing on the page is focusable during normal use
let overlayOpen=false;
function showOverlay(id){
  const o=document.getElementById(id);
  o.querySelectorAll('input,select,textarea').forEach(el=>{el.disabled=false;});
  o.style.display='flex';
  overlayOpen=true;
}
function hideOverlay(id){
  const o=document.getElementById(id);
  o.style.display='none';
  o.querySelectorAll('input,select,textarea').forEach(el=>{el.blur();el.disabled=true;});
  overlayOpen=[...document.querySelectorAll('.overlay')].some(el=>el.style.display==='flex');
}
document.querySelectorAll('.overlay input,.overlay select,.overlay textarea').forEach(el=>{el.disabled=true;});


// --- session logic ---
async function loadSessions(){
  const r=await fetch(`${API}/sessions`);
  sessions=await r.json();
  const at=Date.now();
  sessions.forEach(s=>{s._fetchedAt=at;});
  renderList();
}

function getSession(){return sessions.find(s=>s.id===cur);}

function renderList(){
  const list=document.getElementById('sessions-list');
  list.innerHTML='';
  if(!sessions.length){list.innerHTML='<div class="empty-state">no sessions yet — tap compose to start</div>';return;}
  sessions.forEach(s=>{
    const last=s.drinks.length?s.drinks[s.drinks.length-1]:null;
    const row=document.createElement('div');row.className='session-row';
    row.innerHTML=`<div class="avatar" style="background:${drinkColor(s.total_std)}">${Math.round(s.total_std)}</div><div class="session-info"><div class="session-name">${s.name}</div><div class="session-preview">${last?last.raw:'no drinks yet'}</div></div><div class="session-time">${fmtSessionTime(s.start)}</div>`;
    row.onclick=()=>openSession(s.id);
    list.appendChild(row);
  });
}

function openSession(id){
  cur=id;
  document.getElementById('list-view').style.display='none';
  document.getElementById('chat-view').style.display='flex';
  updateHeader();renderMessages();showKeyboard();
}

// bac as of right now: the server's value burned down by however long ago we
// fetched it. measured against our own clock on both ends, so a phone whose time
// is off from the server's still gets the right elapsed time.
function currentBac(s){
  if(!s) return 0;
  const met = s.metabolism!=null ? s.metabolism : 0.015;
  const since = Date.now() - (s._fetchedAt || Date.now());
  return Math.max(0, (s.bac||0) - met * since / 3600000);
}

function updateHeader(){
  const s=getSession();if(!s)return;
  document.getElementById('header-count').textContent=Math.round(s.total_std);
  document.getElementById('header-bac').textContent=currentBac(s).toFixed(3);
  document.getElementById('header-avatar').style.background=drinkColor(s.total_std);
  document.getElementById('header-name').textContent=s.name;
}

setInterval(()=>{ if(cur!==null) updateHeader(); }, 15000);

function attachLongPress(el, drinkId){
  let timer=null;
  const start=()=>{timer=setTimeout(()=>{
    pendingDeleteId=drinkId;
    el.classList.add('selected');
    showOverlay('delete-overlay');
  },500);};
  const cancel=()=>{if(timer){clearTimeout(timer);timer=null;}};
  el.addEventListener('mousedown',start);
  el.addEventListener('touchstart',start);
  el.addEventListener('mouseup',cancel);
  el.addEventListener('mouseleave',cancel);
  el.addEventListener('touchend',cancel);
  el.addEventListener('touchcancel',cancel);
}

function renderMessages(){
  const s=getSession();if(!s)return;
  const c=document.getElementById('messages');
  c.innerHTML='';
  const td=document.createElement('div');td.className='msg-time-center';
  td.textContent=new Date(s.start).toLocaleString([],{weekday:'short',month:'short',day:'numeric',hour:'2-digit',minute:'2-digit'});
  c.appendChild(td);
  s.drinks.forEach(d=>{
    const sent=document.createElement('div');sent.className='msg-sent';sent.textContent=d.raw;
    attachLongPress(sent, d.id);
    c.appendChild(sent);
    const ts=document.createElement('div');ts.className='msg-ts';ts.textContent=fmtTime(d.ts);
    c.appendChild(ts);
    if(pendingReplies.has(d.id)){
      const typing=document.createElement('div');typing.className='msg-recv typing-indicator';
      typing.innerHTML='<span class="dot"></span><span class="dot"></span><span class="dot"></span>';
      c.appendChild(typing);
    } else {
      const recv=document.createElement('div');recv.className='msg-recv';
      const p1=document.createElement('div');p1.textContent=d.reply_opener;
      const p2=document.createElement('div');p2.textContent=`${d.reply_bac_str}, ${d.reply_std} total`;p2.style.marginTop='6px';
      const p3=document.createElement('div');p3.textContent=d.reply_closer;p3.style.marginTop='6px';
      recv.appendChild(p1);recv.appendChild(p2);recv.appendChild(p3);
      c.appendChild(recv);
    }
  });
  c.scrollTop=c.scrollHeight;
  updateHeader();
}

async function sendDrink(){
  const raw = getDraft();
  if(!raw)return;
  clearDraft();
  const ts = pendingBackdateTs || Date.now();
  pendingBackdateTs = null;
  const r=await fetch(`${API}/sessions/${cur}/drinks`,{
    method:'POST',headers:{'Content-Type':'application/json'},
    body:JSON.stringify({raw,ts})
  });
  const drink=await r.json();
  pendingReplies.add(drink.id);
  await loadSessions();
  renderMessages();
  const delay = 1000 + Math.random() * 9000;
  setTimeout(()=>{
    pendingReplies.delete(drink.id);
    renderMessages();
  }, delay);
}

document.getElementById('send-btn').onclick=sendDrink;

document.getElementById('back-btn').onclick=()=>{
  cur=null;
  document.getElementById('chat-view').style.display='none';
  document.getElementById('list-view').style.display='flex';
  hideKeyboard();
  clearDraft();
  loadSessions();
};

document.getElementById('new-btn').onclick=async()=>{
  const name='Session '+new Date().toLocaleDateString([],{month:'short',day:'numeric'})+' '+fmtTime(Date.now());
  const r=await fetch(`${API}/sessions`,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({name,start:Date.now()})});
  const s=await r.json();
  sessions.unshift(s);
  openSession(s.id);renderList();
};

function endRename(){
  kbTarget='draft';
  renameFresh=false;
  kbEl.classList.remove('above');
  hideOverlay('rename-overlay');
  renderInput();
}
document.getElementById('header-center').onclick=()=>{
  if(!cur)return;
  renameText=getSession().name;
  renameFresh=true;
  kbTarget='rename';
  kbEl.classList.add('above');
  showOverlay('rename-overlay');
  showKeyboard();
  renderInput();
};
document.getElementById('rename-cancel').onclick=endRename;
document.getElementById('rename-save').onclick=async()=>{
  const val=renameText.trim();
  if(val&&cur){
    await fetch(`${API}/sessions/${cur}`,{method:'PATCH',headers:{'Content-Type':'application/json'},body:JSON.stringify({name:val})});
    const s=getSession();s.name=val;
    updateHeader();renderList();
  }
  endRename();
};

document.getElementById('delete-cancel').onclick=()=>{
  document.querySelectorAll('.msg-sent.selected').forEach(el=>el.classList.remove('selected'));
  hideOverlay('delete-overlay');
  pendingDeleteId=null;
};
document.getElementById('delete-confirm').onclick=async()=>{
  if(pendingDeleteId){
    await fetch(`${API}/drinks/${pendingDeleteId}`,{method:'DELETE'});
    pendingDeleteId=null;
    hideOverlay('delete-overlay');
    await loadSessions();
    if(cur){const s=getSession();if(s)renderMessages();}
  }
};
document.getElementById('edit-time-btn').onclick=()=>{
  if(!pendingDeleteId)return;
  pendingEditId=pendingDeleteId;
  const s=getSession();
  const d=s.drinks.find(x=>x.id===pendingEditId);
  if(!d)return;
  hideOverlay('delete-overlay');
  showOverlay('edit-time-overlay');
  document.getElementById('edit-time-input').value=tsToLocalInput(d.ts);
};
document.getElementById('edit-time-cancel').onclick=()=>{
  hideOverlay('edit-time-overlay');
  document.querySelectorAll('.msg-sent.selected').forEach(el=>el.classList.remove('selected'));
  pendingEditId=null;pendingDeleteId=null;
};
document.getElementById('edit-time-save').onclick=async()=>{
  const val=document.getElementById('edit-time-input').value;
  if(val&&pendingEditId){
    await fetch(`${API}/drinks/${pendingEditId}`,{
      method:'PATCH',
      headers:{'Content-Type':'application/json'},
      body:JSON.stringify({ts:localInputToTs(val)})
    });
    await loadSessions();
    renderMessages();
  }
  hideOverlay('edit-time-overlay');
  document.querySelectorAll('.msg-sent.selected').forEach(el=>el.classList.remove('selected'));
  pendingEditId=null;pendingDeleteId=null;
};

document.getElementById('time-btn').onclick=()=>{
  showOverlay('backdate-overlay');
  document.getElementById('backdate-input').value=tsToLocalInput(Date.now());
};
document.getElementById('backdate-now').onclick=()=>{
  pendingBackdateTs=null;
  hideOverlay('backdate-overlay');
};
document.getElementById('backdate-save').onclick=()=>{
  const val=document.getElementById('backdate-input').value;
  pendingBackdateTs=val?localInputToTs(val):null;
  hideOverlay('backdate-overlay');
};

renderInput();
loadSessions();
</script>
</body>
</html>
