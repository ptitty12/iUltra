<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>Messages</title>
  <link rel="icon" type="image/png" href="/static/favicon.png">
  <link rel="apple-touch-icon" href="/static/favicon.png">
  <link rel="manifest" href="/static/manifest.json">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Messages">
  <meta name="theme-color" content="#000000">
  <link rel="stylesheet" href="/static/style.css?v=3">
</head>
<body>
<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <defs>
    <symbol id="i-chevron-left" viewBox="0 0 24 24"><path d="M15 5l-7 7 7 7" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/></symbol>
    <symbol id="i-chevron-right" viewBox="0 0 24 24"><path d="M9 6l6 6-6 6" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/></symbol>
    <symbol id="i-compose" viewBox="0 0 24 24"><path d="M12.5 4.5H6.5A2.5 2.5 0 0 0 4 7v10.5A2.5 2.5 0 0 0 6.5 20H17a2.5 2.5 0 0 0 2.5-2.5v-6" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round"/><path d="M18.2 3.6a1.9 1.9 0 0 1 2.7 2.7L13 14.2l-3.6.9.9-3.6z" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linejoin="round"/></symbol>
    <symbol id="i-search" viewBox="0 0 24 24"><circle cx="10.5" cy="10.5" r="6.5" fill="none" stroke="currentColor" stroke-width="2"/><path d="M15.5 15.5L21 21" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></symbol>
    <symbol id="i-mic" viewBox="0 0 24 24"><rect x="9" y="3" width="6" height="11.5" rx="3" fill="none" stroke="currentColor" stroke-width="1.9"/><path d="M5.5 11.5a6.5 6.5 0 0 0 13 0M12 18v3M9 21h6" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round"/></symbol>
    <symbol id="i-video" viewBox="0 0 24 24"><rect x="2.5" y="6.5" width="13" height="11" rx="3" fill="currentColor"/><path d="M16 11l5.5-3.2v8.4L16 13z" fill="currentColor"/></symbol>
    <symbol id="i-plus" viewBox="0 0 24 24"><path d="M12 5v14M5 12h14" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"/></symbol>
    <symbol id="i-waveform" viewBox="0 0 24 24"><path d="M4 10v4M8 7v10M12 4v16M16 8v8M20 11v2" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></symbol>
    <symbol id="i-arrow-up" viewBox="0 0 24 24"><path d="M12 19V6M6.5 11.5L12 6l5.5 5.5" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/></symbol>
    <symbol id="i-delete" viewBox="0 0 28 20"><path d="M26 1H10L1.5 10 10 19h16a1 1 0 0 0 1-1V2a1 1 0 0 0-1-1z" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linejoin="round"/><path d="M14 6.5l7 7M21 6.5l-7 7" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"/></symbol>
    <symbol id="i-shift" viewBox="0 0 24 24"><path d="M12 3.5l8.5 8.5H15.5v8h-7v-8H3.5z" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linejoin="round"/></symbol>
    <symbol id="i-shift-fill" viewBox="0 0 24 24"><path d="M12 3.5l8.5 8.5H15.5v8h-7v-8H3.5z" fill="currentColor" stroke="currentColor" stroke-width="1.7" stroke-linejoin="round"/></symbol>
    <symbol id="i-caps" viewBox="0 0 24 24"><path d="M12 2.5l8.5 8.5H15.5v5.5h-7V11H3.5z" fill="currentColor" stroke="currentColor" stroke-width="1.5" stroke-linejoin="round"/><path d="M8.5 19.5h7" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"/></symbol>
    <symbol id="i-emoji" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9" fill="none" stroke="currentColor" stroke-width="1.8"/><circle cx="9" cy="10" r="1.2" fill="currentColor"/><circle cx="15" cy="10" r="1.2" fill="currentColor"/><path d="M8 14.5c1 1.6 2.3 2.3 4 2.3s3-.7 4-2.3" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></symbol>
    <symbol id="i-check" viewBox="0 0 24 24"><path d="M5 12.5l4.5 4.5L19 7.5" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/></symbol>
  </defs>
</svg>

<div class="app" id="app">

  <!-- ===== conversation list ===== -->
  <section class="view list-view" id="list-view">
    <div class="list-scroll" id="list-scroll">
      <h1 class="big-title">Messages</h1>
      <div id="sessions-list"></div>
    </div>
    <header class="list-top">
      <button class="glass pill text-btn" id="edit-btn">Edit</button>
      <button class="glass circle" id="new-btn" aria-label="New Message"><svg class="ic" width="22" height="22"><use href="#i-compose"/></svg></button>
    </header>
    <footer class="list-bottom">
      <div class="glass pill search-pill" id="search-pill">
        <svg class="ic" width="18" height="18"><use href="#i-search"/></svg>
        <span>Search</span>
        <svg class="ic" width="18" height="18"><use href="#i-mic"/></svg>
      </div>
    </footer>
  </section>

  <!-- ===== conversation ===== -->
  <section class="view chat-view" id="chat-view" hidden>
    <div class="messages" id="messages"></div>
    <header class="chat-header">
      <button class="glass circle" id="back-btn" aria-label="Back"><svg class="ic" width="22" height="22"><use href="#i-chevron-left"/></svg></button>
      <div class="header-center" id="header-center">
        <div class="avatar avatar-lg lv0" id="header-avatar"><span class="av-count" id="header-count">0</span><span class="av-bac" id="header-bac">0.000</span></div>
        <div class="header-name"><span id="header-name">Jake</span><svg class="ic" width="10" height="10"><use href="#i-chevron-right"/></svg></div>
      </div>
      <button class="glass circle" id="video-btn" aria-label="FaceTime"><svg class="ic" width="24" height="24"><use href="#i-video"/></svg></button>
    </header>
    <footer class="composer" id="composer">
      <button class="glass circle plus-btn" id="plus-btn" aria-label="Apps"><svg class="ic" width="22" height="22"><use href="#i-plus"/></svg></button>
      <div class="field glass" id="field">
        <div class="field-text" id="field-text"></div>
        <span class="field-placeholder" id="field-placeholder">iMessage</span>
        <button class="field-audio" id="audio-btn" aria-label="Audio"><svg class="ic" width="20" height="20"><use href="#i-waveform"/></svg></button>
        <button class="send-btn" id="send-btn" aria-label="Send"><svg class="ic" width="18" height="18"><use href="#i-arrow-up"/></svg></button>
      </div>
    </footer>
  </section>

  <!-- ===== hidden dashboard ===== -->
  <section class="view dash-view" id="dash-view" hidden>
    <header class="dash-top">
      <div class="dash-title">Insights</div>
      <div class="dash-seg glass pill" id="dash-seg">
        <button data-days="7" class="on">7 days</button>
        <button data-days="30">30 days</button>
      </div>
      <button class="glass pill text-btn" id="dash-done">Done</button>
    </header>
    <div class="dash-scroll" id="dash-scroll"></div>
  </section>

  <!-- sheets -->
  <div class="scrim" id="scrim" hidden></div>
  <div class="sheet glass" id="sheet" hidden></div>

  <!-- in-page keyboard: nothing on this page is a real form field, so iOS never
       gets a chance to put its arrows + checkmark bar above a system keyboard -->
  <div class="keyboard" id="keyboard" aria-hidden="true"></div>
</div>

<script src="/static/keyboard.js?v=3"></script>
<script src="/static/dashboard.js?v=3"></script>
<script src="/static/app.js?v=3"></script>
</body>
</html>
