services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      - DB_PATH=/data/drinks.db
    volumes:
      - sqlite_data:/data

  frontend:
    image: nginx:alpine
    restart: unless-stopped
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf
      - ./index.html:/usr/share/nginx/html/index.html
    ports:
      - "3421:80"
    depends_on:
      - backend

volumes:
  sqlite_data: