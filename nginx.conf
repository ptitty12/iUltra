server {
    listen 80;

    resolver 127.0.0.11 valid=30s;
    set $backend "http://backend:8000";

    location /api/ {
        proxy_pass $backend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    location / {
        root /usr/share/nginx/html;
        try_files $uri /index.html;
    }
}